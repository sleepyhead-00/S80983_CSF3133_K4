
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>

    <!-- Link to CSS File -->
    <link rel="stylesheet" href="style.css">

    <!-- Link to JavaScript File -->
    <script src="game.js" defer></script>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Rock, Paper, Scissors</h1>
        <p>Enter your name and play againts the computer!</p>
    </header>

    <!-- Player Section -->
    <section>
        <h2>Player Information</h2>

        <label>Your name: </label>
        <input type="text" id="playerName">

        <button onclick="startGame()">Start Game</button>

        <p id="welcome"></p>
        <p id="startTime"></p>
    </section>

    <!-- Game Section -->
    <section>
        <h2>Game</h2>
            <button onclick="playRound('rock')">Rock</button>
            <button onclick="playRound('paper')">Paper</button>
            <button onclick="playRound('scissors')">Scissors</button>

        <div class="game">
            <div>
                <h3>You</h3>
                <img id="playerImage" src="rock.jpg" alt="Player choice">
            </div>

            <h2>VS</h2>

            <div>
                <h3>Computer</h3>
                <img id="computerImage" src="rock.jpg" alt="Computer choice">
            </div>
        </div>

    </section>

    <!-- Result Section -->
    <section>
        <h2 id="result">Make your choice!</h2>

        <p>
            Wins: <span id="wins">0</span>
            Losses: <span id="losses">0</span>
            Draw: <span id="draws">0</span>
        </p>
    </section>

    <!-- History Section -->
    <section>
        <h2>History</h2>

        <table id="history">
            <tr>
                <th>Round</th>
                <th>You</th>
                <th>Computer</th>
                <th>Result</th>
            </tr>
        </table>

    </section>

    <!-- Summary and Reset -->
    <section>
        <h2>Summary and Reset</h2>

        <button onclick="showSummary()">Show Summary</button>
        <button onclick="resetGame()">Reset</button>
        <p id="summary"></p>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Computer Science Club</p>
    </footer>

</body>
</html>
